<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#fafaf9">
    <title>{% block title %}Meal Planner{% endblock %}</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            font-size: 17px;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 1.25rem;
            color: #292524;
            background: #fafaf9;
            -webkit-text-size-adjust: 100%;
        }
        nav {
            margin-bottom: 1.5rem;
        }
        nav a {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            text-decoration: none;
            color: #64748b;
            font-size: 0.95rem;
            padding: 0.5rem 0;
            min-height: 44px;
            transition: color 0.15s;
        }
        nav a:hover, nav a:active { color: #4f7c6e; }
        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0 0 1.25rem 0;
            color: #4f7c6e;
            letter-spacing: -0.01em;
        }
        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 1.75rem 0 0.75rem 0;
            color: #4f7c6e;
        }
        a { color: #2563eb; text-decoration: none; }
        a:visited { color: #6d28d9; }
        a:active { color: #1d4ed8; }
        .empty {
            color: #9ca3af;
            text-align: center;
            padding: 3rem 1rem;
        }
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% block nav %}<nav><a href="/">&larr; All recipes</a></nav>{% endblock %}
    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}
</body>
</html>
